exp_name: trmisr_ycbcr
run_name: 8_lr_decoder_doubleconv

hydra:
  job:
    chdir: True
  run:
    dir: outputs/${exp_name}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${exp_name}_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

defaults:
  - trainer: default # loads key/value.yaml -> trainer/default.yaml
  - logger: mlflow
  - model: trmisr
  - _self_ # options from this file

debug: false
num_debug_samples: 10

model:
  _target_: models.trmisr.TransformerMISR_DoubleConvDecoder
  in_channels: 3

train_dataset:
  _target_: data.datasets.dataset.MISRDataset
  manifest_path: /pub/users/xnguye28/knn-sr/data/manifests/synth/train_manifest.json
  color_mode: ycbcr
  hq_size:
    - 256
    - 256
  scale_factor: 4
  num_lr_images: 8
  samples_per_scene: 10
  augment_cfg:
    # RandomGamma:
    #   gamma_limit: [ 95, 105 ]
    #   p: 0.5
    GaussNoise:
      std_range: [ 0.01, 0.1 ]
      p: 0.3
    GaussianBlur:
      blur_limit: [ 1, 3 ]
      p: 0.25

val_dataset:
  _target_: data.datasets.dataset.MISRDataset
  manifest_path: /pub/users/xnguye28/knn-sr/data/manifests/synth/dev_manifest.json
  color_mode: ycbcr
  num_lr_images: 8 
  samples_per_scene: 10
  hq_size:
    - 256
    - 256
  scale_factor: 4

dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 24
  num_workers: 2
  shuffle: true
  pin_memory: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3

loss:
  _target_: losses.combined_perceptual.HuberSobelSSIMLoss
  w_huber: 1.0
  w_sobel: 0.65 
  w_ssim: 0.15
  huber_delta: 0.1
  grayscale: False
